name: Ví ảo Breakout (giả lập, không đặt lệnh thật)

# Chạy 4 giờ/lần: theo dõi SL/TP lệnh ảo bằng nến 4H đã đóng; lần chạy đầu tiên sau khi nến ngày đóng (7h VN) thì tìm breakout và mở lệnh ảo.
# KHÔNG dùng khoá sàn, KHÔNG đặt lệnh thật. Chỉ ghi paper/ và báo Telegram.
on:
  schedule:
    - cron: "19 0,4,8,12,16,20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paper
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Chạy ví ảo
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node pump_study.mjs paper
      - name: Lưu
        run: |
          git config user.name "radar-paper"
          git config user.email "radar-paper@users.noreply.github.com"
          git add paper
          git commit -m "ví ảo: $(date -u +%F\ %H:%M)" || true
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin main && git push origin HEAD:main && break; sleep $((i * 5)); done
