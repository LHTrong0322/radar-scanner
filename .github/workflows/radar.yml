name: Radar scanner

on:
  schedule:
    - cron: "7,37 * * * *"   # dự phòng của GitHub (cron-job.org gọi chính mỗi 15 phút)
  workflow_dispatch:          # cho phép bấm chạy tay / cron-job.org gọi
    inputs:
      ping:
        description: "Gửi tin nhắn thử về Telegram"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: radar-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main            # luôn lấy dữ liệu mới nhất, không dùng bản cũ lúc được gọi
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cài thư viện ký lệnh sàn
        run: if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; fi
      - name: Quét kèo và chấm lệnh
        run: if [ -f scanner/scan.mjs ]; then node scanner/scan.mjs; else node scan.mjs; fi
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COINGECKO_KEY: ${{ secrets.COINGECKO_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
          PING: ${{ inputs.ping }}
          # Tự đặt lệnh trên Hyperliquid (bỏ trống secrets thì bot chỉ báo kèo như cũ)
          HL_ADDRESS: ${{ secrets.HL_ADDRESS }}
          HL_AGENT_KEY: ${{ secrets.HL_AGENT_KEY }}
          HL_ENV: ${{ vars.HL_ENV || 'mainnet' }}
          # Arcus (chỉ dùng khi không cài Hyperliquid)
          ARCUS_ADDRESS: ${{ secrets.ARCUS_ADDRESS }}
          ARCUS_PRIVATE_KEY: ${{ secrets.ARCUS_PRIVATE_KEY }}
          ARCUS_API_KEY: ${{ secrets.ARCUS_API_KEY }}
          ARCUS_ENV: ${{ vars.ARCUS_ENV || 'testnet' }}
          ARCUS_ACCOUNT_INDEX: ${{ vars.ARCUS_ACCOUNT_INDEX || '0' }}
          TRADE_MODE: ${{ vars.TRADE_MODE || 'selftest' }}
          TRADE_SIDE: ${{ vars.TRADE_SIDE || 'long' }}
          TRADE_USD: ${{ vars.TRADE_USD || '20' }}
          TRADE_MAX_OPEN: ${{ vars.TRADE_MAX_OPEN || '99' }}
          TRADE_MAX_RISK_PCT: ${{ vars.TRADE_MAX_RISK_PCT || '30' }}
          TRADE_MAX_FUNDING_APR: ${{ vars.TRADE_MAX_FUNDING_APR || '30' }}
          TRADE_RISK_USD: ${{ vars.TRADE_RISK_USD || '0' }}
          TRADE_LIQ_BUFFER: ${{ vars.TRADE_LIQ_BUFFER || '0.7' }}
      - name: Lưu kết quả
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "scan $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git push origin HEAD:main && exit 0
            echo "Có lượt khác vừa lưu, gộp lại rồi thử lại ($i/3)…"
            for f in state.json data/state.json; do [ -f "$f" ] && cp "$f" "/tmp/$(echo $f | tr / _)"; done
            git fetch origin main
            git reset --hard origin/main
            for f in state.json data/state.json; do [ -f "/tmp/$(echo $f | tr / _)" ] && cp "/tmp/$(echo $f | tr / _)" "$f"; done
            git add -A
            git diff --cached --quiet && exit 0
            git commit -m "scan $(date -u +%Y-%m-%dT%H:%MZ)"
            sleep 3
          done
          exit 1
