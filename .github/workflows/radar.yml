name: Radar scanner

on:
  schedule:
    - cron: "7,37 * * * *"   # mỗi 30 phút (phút 7 và 37 để tránh giờ cao điểm của GitHub)
  workflow_dispatch:          # cho phép bấm chạy tay
    inputs:
      ping:
        description: "Gửi tin nhắn thử về Telegram"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: radar-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Quét kèo và chấm lệnh
        run: if [ -f scanner/scan.mjs ]; then node scanner/scan.mjs; else node scan.mjs; fi
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COINGECKO_KEY: ${{ secrets.COINGECKO_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
          PING: ${{ inputs.ping }}
      - name: Lưu kết quả
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "scan $(date -u +%Y-%m-%dT%H:%MZ)" && git pull --rebase && git push)
