name: Nghiên cứu breakout / pump

# Chỉ NGHIÊN CỨU (không quét hằng ngày): mỗi Chủ nhật làm lại với dữ liệu mới nhất
# study: điểm chung trước các đợt pump → pump/report.md, pump/model.json
# candle-study: điểm chung trước các nến tăng >10% H4/D1 + mô hình nến, mẫu hình giá → pump/candles.md
on:
  schedule:
    - cron: "37 1 * * 0"      # 08:37 giờ VN Chủ nhật
  workflow_dispatch:
    inputs:
      mode:
        description: "all, study, candle-study (watch/candle-watch chỉ chạy tay)"
        default: "all"

permissions:
  contents: write

concurrency:
  group: pump
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Chạy
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then MODE=all; fi
          if [ "$MODE" = "all" ]; then node pump_study.mjs study; node pump_study.mjs candle-study; else node pump_study.mjs "$MODE"; fi
      - name: Lưu kết quả
        run: |
          git config user.name "radar-pump"
          git config user.email "radar-pump@users.noreply.github.com"
          git add pump
          git commit -m "pump: $(date -u +%F) ${{ github.event.inputs.mode || 'lịch' }}" || true
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin main && git push origin HEAD:main && break; sleep $((i * 5)); done
