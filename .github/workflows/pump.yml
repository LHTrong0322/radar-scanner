name: Nghiên cứu breakout / pump

# study: nghiên cứu lại toàn bộ dữ liệu từ 2023 (mỗi Chủ nhật + chạy tay) → pump/report.md, pump/model.json
# watch: mỗi sáng sau khi nến ngày đóng (7h giờ VN) → danh sách dự án đang breakout / khớp mẫu trước-pump → pump/watch.md + Telegram
on:
  schedule:
    - cron: "13 0 * * *"      # 07:13 giờ VN hằng ngày: watch
    - cron: "37 1 * * 0"      # 08:37 giờ VN Chủ nhật: study
  workflow_dispatch:
    inputs:
      mode:
        description: "study hoặc watch"
        default: "study"

permissions:
  contents: write

concurrency:
  group: pump
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Chạy
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then if [ "${{ github.event.schedule }}" = "37 1 * * 0" ]; then MODE=study; else MODE=watch; fi; fi
          if [ "$MODE" = "watch" ] && [ ! -f pump/model.json ]; then node pump_study.mjs study; fi
          node pump_study.mjs "$MODE"
      - name: Lưu kết quả
        run: |
          git config user.name "radar-pump"
          git config user.email "radar-pump@users.noreply.github.com"
          git add pump
          git commit -m "pump: $(date -u +%F) ${{ github.event.inputs.mode || 'lịch' }}" || true
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin main && git push origin HEAD:main && break; sleep $((i * 5)); done
